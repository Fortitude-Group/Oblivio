name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: observatory
          POSTGRES_PASSWORD: observatory
          POSTGRES_DB: observatory
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U observatory"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://observatory:observatory@localhost:5432/observatory
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm --filter @observatory/db db:migrate
      - run: pnpm test
      - run: pnpm test:fairness
      - run: pnpm guards
      # E2E (Playwright) runs against a live site with seeded data and a GitHub
      # App credential, so it is a local/manual gate rather than a CI step here.
